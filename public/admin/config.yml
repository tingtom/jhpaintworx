# Sveltia CMS (Decap-compatible fork). Runs as static /admin/ – no server to host.
# Auth: GitHub via OAuth proxy. See README for one-time proxy setup.
backend:
  name: github
  repo: tingtom/jhpaintworx
  branch: main
  base_url: https://sveltia-oauth.example.workers.dev
  auth_endpoint: authorize
  # Replace base_url with your free Cloudflare Worker (sveltia/oauth-proxy) URL.

media_folder: public/images/uploads
public_folder: /jhpaintworx/images/uploads
site_url: https://tingtom.github.io/jhpaintworx/
logo_url: /jhpaintworx/logo.png

collections:
  - name: slides
    label: Homepage hero slides
    folder: src/content/slides
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Heading (top slide only shows), name: title, widget: string }
      - { label: Main text, name: text, widget: text }
      - { label: Image, name: image, widget: image }
      - { label: Caption (small line on slide), name: caption, widget: string, required: false }
      - { label: Order, name: order, widget: number, default: 0 }
  - name: categories
    label: Workshop categories
    folder: src/content/categories
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Label, name: label, widget: string, hint: "Shown in pills and badges — e.g. Motorcycles" }
      - { label: Page heading, name: title, widget: string, required: false, hint: "Defaults to the label" }
      - { label: Order, name: order, widget: number, default: 0 }
      - { label: Description, name: description, widget: text, required: false }
      # Adding a category here creates a new /workshop/<slug>/ page and pill.
      # The Category dropdown on paint jobs is set below — keep it in sync.
  - name: jobs
    label: Paint jobs (workshop)
    folder: src/content/jobs
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: select, options: [cars, classics-historic, commercial, motorcycles, motorsport], hint: "Match the slug of a Workshop category" }
      - { label: Images, name: images, widget: image, multiple: true, required: false, hint: "Add several — the workshop page shows left/right arrows to browse them" }
      - { label: Date, name: date, widget: datetime, required: false }
      - { label: Featured on homepage, name: featured, widget: boolean, default: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Body, name: body, widget: markdown, required: false }
  - name: services
    label: Services
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Icon, name: icon, widget: select, options: [truck, tractor, sparkles, hammer, crosshair, factory], default: sparkles }
      - { label: Short description, name: description, widget: text, required: false }
      - { label: Order, name: order, widget: number, default: 0 }
      - { label: Body, name: body, widget: markdown, required: false }
  - name: about
    label: Meet the team
    files:
      - name: about
        label: Team page
        file: src/content/about/about.md
        fields:
          - { label: Kicker, name: kicker, widget: string, default: "MEET THE TEAM" }
          - { label: Heading, name: title, widget: string }
          - { label: Sub heading, name: sub, widget: text, required: false }
          - { label: Lead paragraph, name: lead, widget: text, required: false }
          - { label: Bullet points, name: points, widget: list, required: false }
          - { label: Extra copy, name: body, widget: markdown, required: false }
          - label: Team members
            name: team
            widget: list
            required: false
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string, required: false }
              - { label: Photo, name: photo, widget: image, required: false }
              - { label: Blurb, name: blurb, widget: text, required: false }
  - name: contact
    label: Contact page
    files:
      - name: contact
        label: Contact page
        file: src/content/contact/contact.md
        fields:
          - { label: Kicker, name: kicker, widget: string, default: "CONTACT" }
          - { label: Heading, name: title, widget: string }
          - { label: Sub heading, name: sub, widget: text, required: false }
          - { label: Note under phone number, name: phoneNote, widget: text, required: false }
          - { label: Note under address, name: addressNote, widget: text, required: false }
  - name: settings
    label: Business details
    file: src/content/settings/settings.md
    fields:
      - { label: Phone number, name: phone, widget: string, hint: "Used in the top bar, footer and buttons" }
      - { label: Opening hours, name: hours, widget: string, hint: "Shown in the top bar" }
      - { label: Address, name: address, widget: text, required: false, hint: "Shown in the footer and on the contact page" }
      - { label: Contact form email, name: email, widget: string, required: false, hint: "Fallback for the form if the build variable isn't set" }
      - { label: Facebook URL, name: facebook, widget: string, required: false, hint: "Leave blank to hide the Facebook icon" }
      - { label: Instagram URL, name: instagram, widget: string, required: false, hint: "Leave blank to hide the Instagram icon" }
      - { label: Map latitude, name: mapLat, widget: number, required: false, value_types: [float], hint: "Map pin on the contact page — right-click the spot on openstreetmap.org and pick 'Show address'" }
      - { label: Map longitude, name: mapLon, widget: number, required: false, value_types: [float], hint: "Leave both blank to hide the map" }